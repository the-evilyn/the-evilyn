<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" width="1000" height="535" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Domain Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>

    <!-- Drop Shadows / Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, "SF Mono", "Liberation Mono", Menlo, Consolas, "Courier New", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .glow-cyan {
      filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.45));
    }
    .glow-purple {
      filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.45));
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="8" y="8" width="984" height="519" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="984" height="519" rx="14" fill="url(#cyberGrid)"/>
  <rect x="8" y="8" width="984" height="519" rx="14" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Cyberpunk Corner HUD Accents -->
  <path d="M 18 36 L 18 18 L 36 18" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 982 36 L 982 18 L 964 18" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 18 499 L 18 517 L 36 517" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 982 499 L 982 517 L 964 517" stroke="#EC4899" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Window Header Bar -->
  <g id="window-header">
    <circle cx="32" cy="32" r="5" fill="#EF4444"/>
    <circle cx="48" cy="32" r="5" fill="#F59E0B"/>
    <circle cx="64" cy="32" r="5" fill="#10B981"/>

    <text x="88" y="36" class="mono" font-size="12" fill="#64748B" font-weight="500">the-evilyn@sec-soc-core: ~/dashboard.sys</text>

    <!-- Top-right Status Pill -->
    <rect x="826" y="20" width="142" height="24" rx="12" fill="#061E1A" stroke="#10B981" stroke-width="1"/>
    <circle cx="840" cy="32" r="4" fill="#10B981" class="glow-cyan"/>
    <text x="852" y="36" class="mono" font-size="11" fill="#10B981" font-weight="700" letter-spacing="1">SYSTEM ONLINE</text>

    <line x1="8" y1="52" x2="992" y2="52" stroke="#1E293B" stroke-width="1"/>
    <line x1="8" y1="52" x2="350" y2="52" stroke="url(#headerGrad)" stroke-width="1.2"/>
  </g>

  <!-- Identity Banner Section -->
  <g id="identity-banner">
    <!-- Security Level Badge -->
    <rect x="32" y="68" width="220" height="20" rx="4" fill="#0C1F33" stroke="#00E5FF" stroke-width="0.8"/>
    <text x="42" y="82" class="mono" font-size="10" fill="#00E5FF" font-weight="700" letter-spacing="1.5">[ SOC_AUTH // LEVEL_ALPHA ]</text>

    <!-- Profile Name -->
    <text x="32" y="117" class="sans glow-cyan" font-size="28" font-weight="900" fill="#F8FAFC" letter-spacing="2">SALMA EL FAHDI</text>

    <!-- Subtitle Track -->
    <text x="32" y="139" class="mono" font-size="13" fill="#94A3B8">
      <tspan fill="#F8FAFC" font-weight="600">Computer Engineering Student</tspan>
      <tspan fill="#334155">  |  </tspan>
      <tspan fill="#00E5FF" font-weight="600">Cybersecurity</tspan>
      <tspan fill="#64748B"> • </tspan>
      <tspan fill="#8B5CF6" font-weight="600">Cloud / DevSecOps</tspan>
      <tspan fill="#64748B"> • </tspan>
      <tspan fill="#EC4899" font-weight="600">Data &amp; AI</tspan>
    </text>

    <!-- Cyber Shield Vector Emblem (Top Right HUD) -->
    <g transform="translate(900, 103)">
      <circle cx="0" cy="0" r="30" fill="#08101E" stroke="#1E293B" stroke-width="1.5"/>
      <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.85"/>
      <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="#0E2439" stroke="#8B5CF6" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3.5" fill="#00E5FF" class="glow-cyan"/>
      <line x1="-34" y1="0" x2="-24" y2="0" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="24" y1="0" x2="34" y2="0" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="0" y1="-34" x2="0" y2="-24" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="0" y1="24" x2="0" y2="34" stroke="#00E5FF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Middle Section: Left Panel (Identity & Whoami) -->
  <g id="panel-identity" transform="translate(32, 156)">
    <!-- Container -->
    <rect x="0" y="0" width="460" height="202" rx="8" fill="#090E1A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 452 0 A 8 8 0 0 1 460 8 L 460 28 L 0 28 Z" fill="#0D1524"/>
    <text x="14" y="19" class="mono" font-size="11" fill="#00E5FF" font-weight="700">&gt; whoami --identity-report</text>
    <text x="398" y="19" class="mono" font-size="10" fill="#64748B">[NODE_01]</text>
    <line x1="0" y1="28" x2="460" y2="28" stroke="#1E293B" stroke-width="1"/>

    <!-- Entries -->
    <!-- whoami -->
    <text x="16" y="52" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; whoami</text>
    <text x="150" y="52" class="mono" font-size="11.5" fill="#00E5FF" font-weight="600">salma@github</text>

    <!-- education -->
    <text x="16" y="77" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; education</text>
    <text x="150" y="77" class="mono" font-size="11.5" fill="#F8FAFC">ENSI Tanger</text>
    <text x="245" y="77" class="mono" font-size="10.5" fill="#64748B">(4th-Year Student)</text>

    <!-- location -->
    <text x="16" y="102" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; location</text>
    <text x="150" y="102" class="mono" font-size="11.5" fill="#F8FAFC">Tangier, Morocco</text>

    <!-- current_mode -->
    <text x="16" y="127" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; current_mode</text>
    <text x="150" y="127" class="mono" font-size="11.5" fill="#10B981" font-weight="700">BUILDING + SECURING</text>

    <!-- mission -->
    <text x="16" y="152" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; mission</text>
    <text x="150" y="152" class="mono" font-size="11.5" fill="#00E5FF" font-weight="600">SECURE SYSTEMS / CLOUD / AI</text>

    <!-- system.status -->
    <text x="16" y="177" class="mono" font-size="11.5" fill="#8B5CF6" font-weight="600">&gt; system.status</text>
    <text x="150" y="177" class="mono" font-size="11.5" fill="#10B981" font-weight="700">ONLINE</text>
    <text x="210" y="177" class="mono" font-size="10.5" fill="#64748B">(pfa_search: active)</text>
  </g>

  <!-- Middle Section: Right Panel (Focus Domains & Telemetry) -->
  <g id="panel-telemetry" transform="translate(508, 156)">
    <!-- Container -->
    <rect x="0" y="0" width="460" height="202" rx="8" fill="#090E1A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 452 0 A 8 8 0 0 1 460 8 L 460 28 L 0 28 Z" fill="#0D1524"/>
    <text x="14" y="19" class="mono" font-size="11" fill="#8B5CF6" font-weight="700">// CORE DOMAINS &amp; FOCUS TELEMETRY</text>
    <text x="398" y="19" class="mono" font-size="10" fill="#64748B">[METRICS]</text>
    <line x1="0" y1="28" x2="460" y2="28" stroke="#1E293B" stroke-width="1"/>

    <!-- Domain 1: Cybersecurity -->
    <text x="16" y="50" class="mono" font-size="11" fill="#00E5FF" font-weight="700">[+] CYBERSECURITY</text>
    <text x="210" y="50" class="mono" font-size="10" fill="#94A3B8">Network • AppSec • IoT Security</text>
    <rect x="16" y="58" width="428" height="6" rx="3" fill="#1E293B"/>
    <rect x="16" y="58" width="400" height="6" rx="3" fill="url(#cyanGrad)"/>

    <!-- Domain 2: Cloud / DevSecOps -->
    <text x="16" y="93" class="mono" font-size="11" fill="#8B5CF6" font-weight="700">[+] CLOUD / DEVSECOPS</text>
    <text x="210" y="93" class="mono" font-size="10" fill="#94A3B8">AWS • Docker • Jenkins • Ansible</text>
    <rect x="16" y="101" width="428" height="6" rx="3" fill="#1E293B"/>
    <rect x="16" y="101" width="345" height="6" rx="3" fill="url(#purpleGrad)"/>

    <!-- Domain 3: Data & AI -->
    <text x="16" y="136" class="mono" font-size="11" fill="#EC4899" font-weight="700">[+] DATA &amp; ARTIFICIAL INTELLIGENCE</text>
    <text x="245" y="136" class="mono" font-size="10" fill="#94A3B8">Python • ML • Analytics</text>
    <rect x="16" y="144" width="428" height="6" rx="3" fill="#1E293B"/>
    <rect x="16" y="144" width="305" height="6" rx="3" fill="url(#pinkGrad)"/>

    <!-- Telemetry Status Pills -->
    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="132" height="20" rx="4" fill="#0C1B2A" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="3" fill="#00E5FF"/>
      <text x="18" y="14" class="mono" font-size="9.5" fill="#38BDF8">SEC_PIPELINE: OK</text>

      <rect x="142" y="0" width="136" height="20" rx="4" fill="#14142B" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="152" cy="10" r="3" fill="#8B5CF6"/>
      <text x="160" y="14" class="mono" font-size="9.5" fill="#A78BFA">CLOUD_DEPLOY: OK</text>

      <rect x="288" y="0" width="140" height="20" rx="4" fill="#1C1024" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="298" cy="10" r="3" fill="#EC4899"/>
      <text x="306" y="14" class="mono" font-size="9.5" fill="#F472B6">AI_MODELS: VERIFIED</text>
    </g>
  </g>

  <!-- Bottom Section: Terminal Execution Window -->
  <g id="bottom-terminal" transform="translate(32, 372)">
    <!-- Container -->
    <rect x="0" y="0" width="936" height="135" rx="8" fill="#05080E" stroke="#1E293B" stroke-width="1"/>

    <!-- Terminal Sub-header -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 928 0 A 8 8 0 0 1 936 8 L 936 24 L 0 24 Z" fill="#0A0E17"/>
    <text x="14" y="16" class="mono" font-size="10" fill="#64748B">terminal: bash [security.sh --build --secure --automate]</text>
    <text x="868" y="16" class="mono" font-size="10" fill="#10B981">● ACTIVE</text>
    <line x1="0" y1="24" x2="936" y2="24" stroke="#1E293B" stroke-width="1"/>

    <!-- Command Prompt -->
    <text x="16" y="44" class="mono" font-size="11.5" fill="#00E5FF" font-weight="700">salma@github:~$</text>
    <text x="135" y="44" class="mono" font-size="11.5" fill="#F8FAFC">./security.sh --build --secure --automate</text>

    <!-- Execution Logs - Row 1 -->
    <g transform="translate(16, 64)">
      <text x="0" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="32" y="0" class="mono" font-size="10.5" fill="#94A3B8">loading cybersecurity modules...</text>

      <text x="290" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="322" y="0" class="mono" font-size="10.5" fill="#94A3B8">initializing cloud environment...</text>

      <text x="590" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="622" y="0" class="mono" font-size="10.5" fill="#94A3B8">checking DevSecOps pipeline...</text>
    </g>

    <!-- Execution Logs - Row 2 -->
    <g transform="translate(16, 84)">
      <text x="0" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="32" y="0" class="mono" font-size="10.5" fill="#94A3B8">exploring artificial intelligence...</text>

      <text x="290" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="322" y="0" class="mono" font-size="10.5" fill="#94A3B8">securing applications &amp; infrastructure...</text>

      <text x="590" y="0" class="mono" font-size="10.5" fill="#10B981" font-weight="700">[OK]</text>
      <text x="622" y="0" class="mono" font-size="10.5" fill="#94A3B8">all SOC security policies enforced.</text>
    </g>

    <!-- Terminal Footer Line & Status Summary -->
    <g transform="translate(16, 114)">
      <text x="0" y="0" class="mono" font-size="11" fill="#00E5FF" font-weight="700">STATUS: ONLINE</text>
      <text x="125" y="0" class="mono" font-size="11" fill="#334155">│</text>
      <text x="145" y="0" class="mono" font-size="11" fill="#8B5CF6" font-weight="700">MODE: BUILD / SECURE / LEARN</text>
      <text x="385" y="0" class="mono" font-size="11" fill="#334155">│</text>
      <text x="405" y="0" class="mono" font-size="11" fill="#10B981" font-weight="700">SYSTEM: OPERATIONAL</text>
      
      <!-- Blinking cursor -->
      <rect x="562" y="-10" width="7.5" height="13" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
